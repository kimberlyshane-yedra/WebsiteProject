<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up Form</title>
    
    <link rel="stylesheet" href="First.css">
</head>
<body>
    <div class="form-container">
        <div id="login-form">
            <h2>Log In</h2>
            <form action="login.php" method="POST">
        <input type="text" name="username_or_email" placeholder="Username or Email" required> 
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" name="submit_login">Log In</button>
        <a href="#" id="show-signup">Don't have an account? Sign Up Here</a>
    </form>
        </div>
        <div id="signup-form">
            <h2>Sign Up</h2>
            <form action="signup.php" method="POST">
                <input type="text" name="fullname" placeholder="Full Name" required>
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password" placeholder="Create Password" required>
        <input type="password" name="confirm_password" placeholder="Confirm Password" required>
        
        <button type="submit" name="submit_signup">Create Account</button>
         <a href="#" id="show-login">Already have an account? Log In.</a>
            </form>
        </div>
    </div>
   <script src="script.js"></script>
</body>
</html>
